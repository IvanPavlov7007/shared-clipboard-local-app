[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-clipboard-local"
version = "0.1.0"
description = "A tiny browser-based shared text clipboard for your local network"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.9,<4", "segno>=1.6.6,<2"]

[project.optional-dependencies]
build = ["build>=1.2,<2", "pyinstaller>=6,<7"]

[project.scripts]
shared-clipboard = "shared_clipboard:main"

[tool.setuptools]
py-modules = ["shared_clipboard"]
